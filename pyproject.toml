[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fare-forecasting"
version = "0.1.0"
description = "Factor-Aware Retrieval with Error-Guided Fusion for retail forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "threadpoolctl>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
