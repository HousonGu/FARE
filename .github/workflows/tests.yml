name: Smoke checks
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements.txt
      - run: python run.py --list
      - run: python run.py --dataset favorita --backbone chronos --stage audit --dry-run
